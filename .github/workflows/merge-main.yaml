name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: go-task/setup-task@v2.2.0

      - name: Login to Quay
        uses: docker/login-action@v4.8.0
        with:
          registry: quay.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          task build
          task push
        env:
          RELEASE_ID: ${{ github.run_number }}
